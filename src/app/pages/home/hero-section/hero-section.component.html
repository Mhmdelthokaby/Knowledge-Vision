<section class=" p-0 m-0 position-relative">
    <div class="hero-section w-100 vh-100 p-0 bg-opacity-10">
        <div class="text-white w-100 vh-100 row  row-cols-sm-1 row-cols-md-2 bg-dark bg-opacity-10 p-3 m-0">
            <div class="d-flex justify-content-center align-items-center">
                <img [src]="imageUrl" alt="Dynamic image" class="w-50 rounded-3 custom-shadow">
            </div>
            <!--  -->
            <div class="d-flex justify-content-end align-items-center text-end">
                <div>
                    <div class="vstack gap-3">
                        <span class="text-success fs-1"><i class="fa-solid fa-book-open"></i></span>
                        <h1 class="fs-1">كل كتاب تفتحه، هو عالم جديد تكتشفه</h1>
                        <h3 class="lead fs-5">لا تكتفِ بواقع واحد، اترك عالمك خلفك وادخل إلى قصص الآخرين، واكتشف ما لم تعشه من قبل.
                        </h3>
                        <div class="d-flex justify-content-between bg-white flex-row-reverse py-1 rounded-2">
                            <input type="text" class="border-0 w-75 rounded-3 px-1 py-2 text-end" placeholder="ابحث عن كتابك المفضل">
                            <input type="button" value="ابحث" class="border-0 bg-success text-white px-5 rounded-2">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="position-absolute bottom-0 start-50 end-50">
        <div class="bg-white text-success px-4 py-3 d-flex justify-content-center align-items-center rounded-3">
            <span><i class="fa-solid fa-chevron-down"></i></span>
        </div>
    </div>
</section>
